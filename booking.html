<section class="breadcrumb-section">
  <div class="container">
    <h1 class="breadcrumb-title">Book a Service</h1>
    <nav class="breadcrumb-custom">
      <div class="item"><a href="index.html">Home</a></div>
      <div class="separator"><i class="fas fa-chevron-right"></i></div>
      <div class="item active">Book a Plumber</div>
    </nav>
  </div>
</section>

<section class="form-section section-padding">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="form-card">
          <div class="form-card-header">
            <div class="form-card-icon"><i class="fas fa-calendar-check"></i></div>
            <h2 class="section-title mb-1" style="font-size:1.75rem">Book a <span>Plumber</span></h2>
            <p class="text-muted">Fill in the details below and we'll arrange a plumber for you.</p>
          </div>

          <form id="bookingForm" novalidate>
            <div class="row g-4">
              <div class="col-md-6">
                <div class="form-group-custom">
                  <label class="form-label-custom"><i class="fas fa-user"></i> Full Name <span class="required">*</span></label>
                  <input type="text" name="cname" class="form-control-custom" placeholder="Your full name" required>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group-custom">
                  <label class="form-label-custom"><i class="fas fa-phone-alt"></i> Mobile Number <span class="required">*</span></label>
                  <input type="tel" name="phone" class="form-control-custom" placeholder="10-digit mobile number" maxlength="10" required>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group-custom">
                  <label class="form-label-custom"><i class="fas fa-envelope"></i> Email</label>
                  <input type="email" name="email" class="form-control-custom" placeholder="your@email.com">
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group-custom">
                  <label class="form-label-custom"><i class="fas fa-tools"></i> Service Type <span class="required">*</span></label>
                  <select name="service_type" class="form-control-custom" required>
                    <option value="">Select service...</option>
                    <option>Pipe Repair</option>
                    <option>Drain Cleaning</option>
                    <option>Water Heater</option>
                    <option>Bathroom Fitting</option>
                    <option>Leak Detection</option>
                    <option>Emergency Plumbing</option>
                  </select>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group-custom">
                  <label class="form-label-custom"><i class="fas fa-hard-hat"></i> Select Plumber <span class="required">*</span></label>
                  <select name="plumber_id" class="form-control-custom" required>
                    <option value="">Choose a plumber...</option>
                    <option value="1">Rajesh Kumar — Vijayawada, Amaravati</option>
                    <option value="2">Suresh Babu — Guntur, Tenali</option>
                    <option value="3">Venkat Rao — Vijayawada</option>
                    <option value="4">Anil Sharma — Machilipatnam, Krishna</option>
                  </select>
                </div>
              </div>
              <div class="col-md-3">
                <div class="form-group-custom">
                  <label class="form-label-custom"><i class="fas fa-calendar"></i> Date <span class="required">*</span></label>
                  <input type="date" name="bdate" class="form-control-custom" required>
                </div>
              </div>
              <div class="col-md-3">
                <div class="form-group-custom">
                  <label class="form-label-custom"><i class="fas fa-clock"></i> Time <span class="required">*</span></label>
                  <input type="time" name="btime" class="form-control-custom" required>
                </div>
              </div>
              <div class="col-12">
                <div class="form-group-custom">
                  <label class="form-label-custom"><i class="fas fa-map-marker-alt"></i> Full Address <span class="required">*</span></label>
                  <textarea name="address" class="form-control-custom" rows="2" placeholder="Door no, street, area, city..." required></textarea>
                </div>
              </div>
              <div class="col-12">
                <div class="form-group-custom">
                  <label class="form-label-custom"><i class="fas fa-comment-alt"></i> Problem Description <span class="required">*</span></label>
                  <textarea name="problem" class="form-control-custom" rows="4" placeholder="Describe your plumbing issue in detail..." required></textarea>
                </div>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-accent btn-block btn-lg"><i class="fas fa-calendar-check"></i> Confirm Booking</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<script src="js/main.js"></script>
<script>
  // Demo: prevent actual submission since there's no backend in static HTML
  document.getElementById('bookingForm').addEventListener('submit', function(e){
    e.preventDefault();
    if (this.checkValidity()) {
      PlumberPro.showToast('✅ Booking confirmed! (Demo — connect to PHP backend for real bookings)', 'success');
      this.reset();
    }
  });
</script>
</body>
