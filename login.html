<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | PlumberPro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/plumber-service.css">
</head>
<body>

<nav class="navbar navbar-custom navbar-expand-lg" id="mainNavbar">
  <div class="container">
    <a class="navbar-brand-custom" href="index.html">
      <div class="logo-icon"><i class="fas fa-wrench"></i></div>
      <span class="logo-text-main">Plumber</span><span class="logo-text-accent">Pro</span>
    </a>
    <button class="navbar-toggler-custom d-lg-none" id="navToggler" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto navbar-nav-custom align-items-lg-center">
        <li class="nav-item"><a class="nav-link-custom" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link-custom" href="plumbers.html">Find Plumber</a></li>
        <li class="nav-item"><a class="nav-link-custom" href="register-plumber.html">Register as Plumber</a></li>
        <li class="nav-item"><a class="nav-link-custom" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link-custom" href="contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link-custom nav-btn-login active" href="login.html"><i class="fas fa-sign-in-alt me-1"></i>Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="form-section section-padding" style="min-height:80vh;display:flex;align-items:center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="form-card">
          <div class="form-card-header">
            <div class="form-card-icon"><i class="fas fa-sign-in-alt"></i></div>
            <h2 class="section-title mb-1" style="font-size:1.75rem">Welcome <span>Back</span></h2>
            <p class="text-muted">Sign in to your PlumberPro account</p>
          </div>

          <form id="loginForm">
            <div class="d-flex gap-2 mb-5">
              <label class="filter-btn flex-fill text-center active" style="cursor:pointer">
                <input type="radio" name="role" value="customer" style="display:none" checked> Customer
              </label>
              <label class="filter-btn flex-fill text-center" style="cursor:pointer">
                <input type="radio" name="role" value="plumber" style="display:none"> Plumber
              </label>
              <label class="filter-btn flex-fill text-center" style="cursor:pointer">
                <input type="radio" name="role" value="admin" style="display:none"> Admin
              </label>
            </div>

            <div class="form-group-custom">
              <label class="form-label-custom"><i class="fas fa-envelope"></i> Email Address</label>
              <input type="email" name="email" class="form-control-custom" placeholder="your@email.com" required>
            </div>
            <div class="form-group-custom">
              <label class="form-label-custom"><i class="fas fa-lock"></i> Password</label>
              <input type="password" name="password" class="form-control-custom" placeholder="Your password" required>
            </div>

            <button type="submit" class="btn btn-primary-custom btn-block btn-lg mt-3"><i class="fas fa-sign-in-alt"></i> Login</button>
          </form>

          <hr class="my-4">
          <p class="text-center text-muted" style="font-size:.875rem">
            New plumber? <a href="register-plumber.html" style="color:var(--primary);font-weight:600">Register here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="footer-custom">
  <div class="container">
    <div class="footer-bottom">
      <p class="footer-copyright mb-0">&copy; 2026 <a href="index.html">PlumberPro</a>. All rights reserved.</p>
      <div class="footer-bottom-links"><a href="#">Privacy Policy</a><a href="#">Terms of Service</a><a href="#">Sitemap</a></div>
    </div>
  </div>
</footer>

<button class="back-to-top" id="backToTop" aria-label="Back to top"><i class="fas fa-chevron-up"></i></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    if (this.checkValidity()) {
      PlumberPro.showToast('✅ Login successful! (Demo — connect to PHP backend for real auth)', 'success');
    }
  });
</script>
</body>
</html>
